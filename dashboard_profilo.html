<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il mio profilo — MusicHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-box">
      <a class="brand" href="index.html">🎵 MusicHub</a>
      <input type="checkbox" id="menu-toggle">
      <label for="menu-toggle" class="hamburger">☰</label>
      <div class="nav-menu">
        <ul class="nav-links">
          <li><a href="strumenti.html">Strumenti</a></li>
          <li><a href="corsi.html">Lezioni</a></li>
        </ul>
        <div class="nav-azioni">
          <button id="tema" aria-label="Cambia tema chiaro/scuro">🌙</button>
          <span>Ciao, <strong>Mario</strong></span>
          <a href="login.html">Esci</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- CONTENUTO -->
  <div class="container py-4">
    <div class="row g-4">

      <!-- SIDEBAR -->
      <aside class="col-lg-3">
        <div class="sidebar-box rounded-3 p-3">
          <div class="d-flex align-items-center gap-3 mb-3 pb-3 sidebar-user-border">
            <div class="avatar flex-shrink-0">MR</div>
            <div>
              <p class="fw-semibold mb-0 small testo-bianco">Mario Rossi</p>
              <p class="mb-0 testo-muted-inline testo-ruolo-small">Cliente</p>
            </div>
          </div>
          <nav class="d-flex flex-column gap-1">
            <a href="dashboard.html" class="btn-scheda text-start">📊 Panoramica</a>
            <a href="dashboard_acquisti.html" class="btn-scheda text-start">🎸 I miei acquisti</a>
            <a href="dashboard_lezioni.html" class="btn-scheda text-start">📅 Le mie lezioni</a>
            <a href="dashboard_profilo.html" class="btn-scheda text-start pill-tab-active">👤 Il mio profilo</a>
          </nav>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="col-lg-9">

        <h1 class="h4 fw-bold mb-4 testo-bianco">Il mio profilo</h1>

        <div class="rounded-3 p-4 form-profilo-bg">

          <!-- Sezione dati personali -->
          <div class="mb-3">
            <label for="profilo-nome" class="campo-label">Nome</label>
            <input type="text" id="profilo-nome" class="campo-input" value="Mario">
          </div>

          <div class="mb-3">
            <label for="profilo-cognome" class="campo-label">Cognome</label>
            <input type="text" id="profilo-cognome" class="campo-input" value="Rossi">
          </div>

          <div class="mb-3">
            <label for="profilo-email" class="campo-label">Email</label>
            <input type="email" id="profilo-email" class="campo-input" value="mario.rossi@email.it">
          </div>

          <div class="mb-3">
            <label for="profilo-account-tipo" class="campo-label">Tipo di account</label>
            <input type="text" id="profilo-account-tipo" class="campo-input input-disabled" value="Cliente" disabled>
          </div>

          <hr class="hr-bordo">

          <!-- Sezione cambio password -->
          <p class="small fw-semibold mb-2 testo-bianco">Cambia password</p>

          <div class="mb-3">
            <label for="profilo-vecchia-pw" class="campo-label">Password attuale</label>
            <input type="password" id="profilo-vecchia-pw" class="campo-input" placeholder="••••••••">
          </div>

          <div class="mb-4">
            <label for="profilo-nuova-pw" class="campo-label">Nuova password</label>
            <input type="password" id="profilo-nuova-pw" class="campo-input" placeholder="Almeno 8 caratteri">
          </div>

          <button class="btn-primary">Salva modifiche</button>

        </div>

      </main>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="footer-box">
        <a class="brand" href="index.html">🎵 MusicHub</a>
        <small class="footer-copy">20063338 — Uniupo</small>
        <nav class="footer-nav" aria-label="Navigazione footer">
          <a href="strumenti.html">Strumenti</a>
          <a href="corsi.html">Lezioni</a>
          <a href="login.html">Accedi</a>
        </nav>
      </div>
    </div>
  </footer>

  <!-- SCRIPT TEMA -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const btn  = document.getElementById('tema');
    const html = document.documentElement;
    if (localStorage.getItem('tema') === 'chiaro') {
      html.setAttribute('data-tema', 'chiaro');
      btn.textContent = '☀️';
    }
    btn.addEventListener('click', () => {
      const t = html.getAttribute('data-tema');
      if (t === 'chiaro') {
        html.removeAttribute('data-tema');
        btn.textContent = '🌙';
        localStorage.setItem('tema', 'scuro');
      } else {
        html.setAttribute('data-tema', 'chiaro');
        btn.textContent = '☀️';
        localStorage.setItem('tema', 'chiaro');
      }
    });
  </script>
</body>
</html>
