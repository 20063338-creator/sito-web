<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aggiungi corso — MusicHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar">
    <div class="nav-box">

      <a class="brand" href="index.html">🎵 MusicHub</a>

      <input type="checkbox" id="menu-toggle">
      <label for="menu-toggle" class="hamburger">☰</label>

      <div class="nav-menu">

        <ul class="nav-links">
          <li><a href="strumenti.html">Strumenti</a></li>
          <li><a href="corsi.html">Lezioni</a></li>
        </ul>

        <div class="nav-azioni">
          <button id="tema" aria-label="Cambia tema chiaro/scuro">🌙</button>
          <span>Ciao, <strong>Marco</strong></span>
          <a href="login.html">Esci</a>
        </div>

      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row g-4">

      <!-- Sidebar -->
      <aside class="col-lg-3">
        <div class="sidebar-box rounded-3 p-3">

          <div class="d-flex align-items-center gap-3 mb-3 pb-3 sidebar-user-border">
            <div class="avatar flex-shrink-0">MR</div>

            <div>
              <p class="fw-semibold mb-0 small testo-bianco">Marco Rossi</p>
              <p class="mb-0 testo-muted-inline testo-ruolo-small">Insegnante</p>
            </div>
          </div>

          <nav>
            <div class="d-flex flex-column gap-2">

              <a href="dashboard_insegnante.html" class="btn-scheda text-start">
                📊 Dashboard
              </a>

              <a href="prenotazioni_insegnante.html" class="btn-scheda text-start">
                📅 Prenotazioni
              </a>

              <a href="corsi_insegnante.html" class="btn-scheda text-start">
                🎸 I miei corsi
              </a>

              <a href="disponibilita_insegnante.html" class="btn-scheda text-start">
                ⏰ Disponibilità
              </a>

              <a href="messaggi.html" class="btn-scheda text-start">
                💬 Messaggi
              </a>

            </div>
          </nav>

        </div>
      </aside>

      <!-- MAIN -->
      <main class="col-lg-9">

        <h1 class="h4 fw-bold mb-4 testo-bianco">
          Aggiungi un nuovo corso
        </h1>

        <div class="rounded-3 p-4 form-profilo-bg">

          <div class="mb-3">
            <label for="corso-titolo" class="campo-label">Titolo del corso</label>
            <input type="text" id="corso-titolo" class="campo-input" placeholder="es. Chitarra per principianti">
          </div>

          <div class="row g-3 mb-3">

            <div class="col-sm-6">
              <label for="corso-strumento" class="campo-label">Strumento</label>
              <select id="corso-strumento" class="campo-input">
                <option>Chitarra acustica</option>
                <option>Chitarra elettrica</option>
                <option>Pianoforte</option>
                <option>Violino</option>
                <option>Batteria</option>
                <option>Flauto</option>
                <option>Tromba</option>
                <option>Canto</option>
              </select>
            </div>

            <div class="col-sm-6">
              <label for="corso-livello" class="campo-label">Livello</label>
              <select id="corso-livello" class="campo-input">
                <option>Principiante</option>
                <option>Intermedio</option>
                <option>Avanzato</option>
                <option>Tutti i livelli</option>
              </select>
            </div>

          </div>

          <div class="mb-3">
            <label for="corso-descrizione" class="campo-label">Descrizione</label>
            <textarea id="corso-descrizione" class="campo-input" rows="4"></textarea>
          </div>

          <div class="row g-3 mb-3">

            <div class="col-sm-6">
              <label for="corso-durata" class="campo-label">Durata (minuti)</label>
              <select id="corso-durata" class="campo-input">
                <option>30</option>
                <option>45</option>
                <option selected>60</option>
                <option>90</option>
              </select>
            </div>

            <div class="col-sm-6">
              <label for="corso-prezzo" class="campo-label">Prezzo (€)</label>
              <input type="number" id="corso-prezzo" class="campo-input">
            </div>

          </div>

          <div class="mb-4">
            <label class="campo-label">Modalità</label>

            <div class="auth-radio-lista">

              <div class="auth-radio-card">
                <input type="radio" name="modalita" checked>
                <label class="auth-radio-label">
                  🌐 Online
                </label>
              </div>

              <div class="auth-radio-card">
                <input type="radio" name="modalita">
                <label class="auth-radio-label">
                  📍 In presenza
                </label>
              </div>

            </div>
          </div>

          <div class="d-flex gap-3">
            <button class="btn-primary">Pubblica corso</button>
            <a href="dashboard_insegnante.html" class="btn-outline">Annulla</a>
          </div>

        </div>

      </main>

    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-box">

        <a class="brand" href="index.html">🎵 MusicHub</a>
        <small class="footer-copy">20063338 — Uniupo</small>

        <nav class="footer-nav">
          <a href="strumenti.html">Strumenti</a>
          <a href="corsi.html">Lezioni</a>
          <a href="login.html">Accedi</a>
        </nav>

      </div>
    </div>
  </footer>

  <script>
    const btn = document.getElementById('tema');
    const html = document.documentElement;

    if (localStorage.getItem('tema') === 'chiaro') {
      html.setAttribute('data-tema', 'chiaro');
      btn.textContent = '☀️';
    }

    btn.addEventListener('click', () => {
      const t = html.getAttribute('data-tema');

      if (t === 'chiaro') {
        html.removeAttribute('data-tema');
        btn.textContent = '🌙';
        localStorage.setItem('tema', 'scuro');
      } else {
        html.setAttribute('data-tema', 'chiaro');
        btn.textContent = '☀️';
        localStorage.setItem('tema', 'chiaro');
      }
    });
  </script>

</body>
</html>
